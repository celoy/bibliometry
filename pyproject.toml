[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometry"
version = "0.1.0"
description = "Harvest and analyse the OpenAlex publications of one institution and a list of its people"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=7.0", "jupyter>=1.0", "nbconvert>=7.0"]

[project.scripts]
bibliometry = "bibliometry.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
